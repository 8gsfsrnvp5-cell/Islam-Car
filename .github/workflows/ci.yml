name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — линтер, миграции, тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: islamcar
          POSTGRES_PASSWORD: islamcar
          POSTGRES_DB: islamcar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U islamcar" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://islamcar:islamcar@localhost:5432/islamcar_test
      TEST_DATABASE_URL: postgresql+psycopg://islamcar:islamcar@localhost:5432/islamcar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Шрифт с кириллицей для PDF
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Миграции применяются и совпадают с моделями
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest

  web:
    name: Веб — типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:shared
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck

  windows-launcher:
    name: Windows — проверка запуска двух кабинетов
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 — синтаксис и безопасный запуск
        shell: powershell
        run: .\scripts\test-windows-launcher.ps1

  local-stack:
    name: Docker — администратор и клиент через два сайта
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISLAMCAR_DISPOSABLE_STACK: "1"
      ISLAMCAR_CHECK_PASSWORD: CI-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Настроить изолированную локальную базу
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-only-database-secret
          ENVIRONMENT=development
          COOKIE_SECURE=false
          CLIENT_PUBLIC_URL=http://localhost:3000
          PUBLIC_CLIENT_URL=http://localhost:3000
          ENV
      - name: Собрать и запустить все пять сервисов
        run: docker compose up -d --build
      - name: Дождаться API и создать владельца CI
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(90):
              try:
                  urllib.request.urlopen("http://localhost:8000/api/health", timeout=5).close()
                  break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit("API did not become ready")
          PY
          docker compose exec -T -e ISLAMCAR_CHECK_PASSWORD api python -m scripts.create_owner --login ci-owner@example.test --name "CI owner" --password-env ISLAMCAR_CHECK_PASSWORD
      - name: Проверить вход администратора и клиента
        run: python scripts/check-local-stack.py
      - name: Логи при сбое
        if: failure()
        run: docker compose logs --tail 60
      - name: Удалить одноразовые контейнеры CI
        if: always()
        run: docker compose down -v
