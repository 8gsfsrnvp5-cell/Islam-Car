# Template for nginx http{} context, not installed automatically.
# Replace domains/certificate paths before nginx -t and deployment.
limit_req_zone $binary_remote_addr zone=islamcar_auth:10m rate=5r/m;
map $host $islamcar_upstream {
    default "";
    client.example.invalid 127.0.0.1:3000;
    admin.example.invalid 127.0.0.1:3001;
}
server {
    listen 80;
    server_name client.example.invalid admin.example.invalid;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name client.example.invalid admin.example.invalid;
    ssl_certificate /etc/letsencrypt/live/islamcar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/islamcar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    if ($islamcar_upstream = "") { return 444; }
    location / {
        proxy_pass http://$islamcar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite untrusted incoming headers; do not append attacker-supplied addresses.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
    location /api/auth/ {
        limit_req zone=islamcar_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$islamcar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
