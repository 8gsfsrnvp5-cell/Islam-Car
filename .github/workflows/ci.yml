name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — линтер, миграции, тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: islamcar
          POSTGRES_PASSWORD: islamcar
          POSTGRES_DB: islamcar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U islamcar" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://islamcar:islamcar@localhost:5432/islamcar_test
      TEST_DATABASE_URL: postgresql+psycopg://islamcar:islamcar@localhost:5432/islamcar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - name: Шрифт с кириллицей для PDF
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Миграции применяются и совпадают с моделями
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest

  web:
    name: Веб — типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:shared
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck
