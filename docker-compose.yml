# Islamic Car — локальный и серверный запуск.
# Секреты задаются в файле .env рядом с этим файлом (образец — .env.example). .env не хранится в git.
#   docker compose up -d --build
# Сервисы слушают только 127.0.0.1; наружу публикуются через обратный прокси с HTTPS (см. docs/security.md).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: islamcar
      POSTGRES_USER: islamcar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U islamcar -d islamcar"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://islamcar:${POSTGRES_PASSWORD}@db:5432/islamcar
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Europe/Moscow}
    volumes:
      - storage:/data/storage
    ports:
      - "127.0.0.1:8000:8000"

  client:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP: client
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

  admin:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args:
        APP: admin
        NEXT_PUBLIC_CLIENT_URL: ${PUBLIC_CLIENT_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
  storage:
